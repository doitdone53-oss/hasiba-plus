
<!-- Hasiba Plus: Beat the Clock Game -->
<style>
#hasibaGame {
  margin: 30px auto;
  padding: 22px;
  max-width: 760px;
  color: #1f2937;
  background: #fff;
  border: 2px solid #b91c1c;
  border-radius: 18px;
  box-sizing: border-box;
  text-align: center;
}
#hasibaGame * { box-sizing: border-box; }
#hasibaGame h2 { color: #b91c1c; margin-top: 0; }
#hasibaGame .hg-stats {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
  margin: 18px 0;
}
#hasibaGame .hg-stat {
  padding: 12px 5px;
  background: #fff1f2;
  border-radius: 10px;
}
#hasibaGame .hg-stat strong {
  display: block;
  font-size: 23px;
  color: #b91c1c;
}
#hasibaGame .hg-question {
  font-size: clamp(27px,6vw,40px);
  font-weight: 800;
  margin: 24px 0;
  overflow-wrap: anywhere;
}
#hasibaGame .hg-answers {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}
#hasibaGame button {
  cursor: pointer;
  touch-action: manipulation;
  font: inherit;
  font-weight: 700;
  border-radius: 10px;
  padding: 13px 10px;
  min-height: 48px;
}
#hasibaGame .hg-answer {
  background: #fff;
  border: 2px solid #b91c1c;
  color: #b91c1c;
  font-size: 20px;
}
#hasibaGame .hg-answer:active { background: #fee2e2; }
#hasibaGame .hg-primary {
  background: #b91c1c;
  color: #fff;
  border: 2px solid #b91c1c;
}
#hasibaGame .hg-secondary {
  background: white;
  color: #b91c1c;
  border: 2px solid #b91c1c;
}
#hasibaGame .hg-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}
#hasibaGame .hg-message {
  min-height: 28px;
  margin: 15px 0 5px;
  font-weight: 700;
}
#hasibaGame .hg-note {
  font-size: 13px;
  color: #6b7280;
  line-height: 1.7;
}
@media(max-width:420px) {
  #hasibaGame { padding: 14px; }
  #hasibaGame .hg-stat { font-size: 13px; }
  #hasibaGame .hg-stat strong { font-size: 20px; }
}
</style>

<section id="hasibaGame" dir="rtl" aria-labelledby="hgTitle">
  <h2 id="hgTitle">🏆 اسبقهم | Beat the Clock</h2>
  <p id="hgIntro">اختبر سرعتك وذكاءك! أجب عن أكبر عدد من الأسئلة خلال 60 ثانية.</p>

  <div class="hg-actions">
    <button type="button" class="hg-secondary" id="hgLang">English</button>
  </div>

  <div class="hg-stats">
    <div class="hg-stat">
      <span id="hgScoreLabel">النقاط</span>
      <strong id="hgScore">0</strong>
    </div>
    <div class="hg-stat">
      <span id="hgTimeLabel">الوقت</span>
      <strong><span id="hgTime">60</span></strong>
    </div>
    <div class="hg-stat">
      <span id="hgBestLabel">أفضل نتيجة</span>
      <strong id="hgBest">0</strong>
    </div>
  </div>

  <div id="hgQuestion" class="hg-question">هل أنت مستعد؟</div>
  <div id="hgAnswers" class="hg-answers"></div>
  <p id="hgMessage" class="hg-message" aria-live="polite">اضغط ابدأ لتحدي نفسك.</p>

  <div class="hg-actions">
    <button type="button" class="hg-primary" id="hgStart">ابدأ اللعب</button>
    <button type="button" class="hg-secondary" id="hgReset">إعادة اللعب</button>
  </div>

  <p class="hg-note" id="hgNote">
    كل إجابة صحيحة تمنحك نقطة. حاول تحطيم رقمك القياسي!
  </p>
</section>

<script>
(function () {
  const root = document.getElementById("hasibaGame");
  if (!root || root.dataset.ready === "1") return;
  root.dataset.ready = "1";

  const $ = id => document.getElementById(id);
  let lang = "ar";
  let score = 0;
  let time = 60;
  let running = false;
  let ended = false;
  let timer = null;
  let correctAnswer = 0;
  let questionCount = 0;
  let best = 0;

  try {
    best = Number(localStorage.getItem("hasibaGameBest") || 0);
    if (!Number.isFinite(best) || best < 0) best = 0;
  } catch (_) {}

  const words = {
    ar: {
      intro: "اختبر سرعتك وذكاءك! أجب عن أكبر عدد من الأسئلة خلال 60 ثانية.",
      score: "النقاط", time: "الوقت", best: "أفضل نتيجة",
      ready: "هل أنت مستعد؟", start: "ابدأ اللعب",
      reset: "إعادة اللعب", note: "كل إجابة صحيحة تمنحك نقطة. حاول تحطيم رقمك القياسي!",
      prompt: "اضغط ابدأ لتحدي نفسك.", right: "إجابة صحيحة! أحسنت 🎉",
      wrong: "ليست صحيحة! حاول في السؤال التالي.",
      end: "انتهى الوقت! نتيجتك: ", again: "العب مرة أخرى",
      newBest: "رقم قياسي جديد! 🏆",
      questions: ["كم يساوي", "احسب", "أوجد الناتج"]
    },
    en: {
      intro: "Test your speed and brain! Answer as many questions as you can in 60 seconds.",
      score: "Score", time: "Time", best: "Best",
      ready: "Ready to play?", start: "Start Game",
      reset: "Play Again", note: "Each correct answer earns one point. Beat your best score!",
      prompt: "Press Start to challenge yourself.", right: "Correct! Well done 🎉",
      wrong: "Not quite! Try the next question.",
      end: "Time's up! Your score: ", again: "Play Again",
      newBest: "New high score! 🏆",
      questions: ["What is", "Calculate", "Solve"]
    }
  };

  function setText(id, key) { $(id).textContent = words[lang][key]; }

  function updateBest() { $("hgBest").textContent = best; }

  function setLanguage(next) {
    lang = next;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    setText("hgIntro", "intro");
    setText("hgScoreLabel", "score");
    setText("hgTimeLabel", "time");
    setText("hgBestLabel", "best");
    setText("hgStart", "start");
    setText("hgReset", "reset");
    setText("hgNote", "note");
    $("hgLang").textContent = lang === "ar" ? "English" : "العربية";
    if (!running && !ended) {
      $("hgQuestion").textContent = words[lang].ready;
      $("hgMessage").textContent = words[lang].prompt;
    }
    if (running) newQuestion();
  }

  function makeQuestion() {
    const difficulty = Math.min( questionCount, 20);
    const type = Math.floor(Math.random() * (difficulty < 3 ? 3 : 5));
    let a, b, answer, symbol, question;

    if (type === 0) {
      a = 2 + Math.floor(Math.random() * (10 + difficulty * 3));
      b = 1 + Math.floor(Math.random() * (10 + difficulty * 2));
      answer = a + b; symbol = "+";
    } else if (type === 1) {
      a = 10 + Math.floor(Math.random() * (20 + difficulty * 4));
      b = 1 + Math.floor(Math.random() * Math.min(a, 15 + difficulty));
      answer = a - b; symbol = "−";
    } else if (type === 2) {
      a = 2 + Math.floor(Math.random() * (8 + Math.floor(difficulty / 2)));
      b = 2 + Math.floor(Math.random() * 10);
      answer = a * b; symbol = "×";
    } else if (type === 3) {
      b = [5, 10, 20, 25, 50][Math.floor(Math.random() * 5)];
      a = 20 + Math.floor(Math.random() * 19) * 10;
      answer = a * b / 100;
      question = `${b}% ${lang === "ar" ? "من" : "of"} ${a}`;
    } else {
      a = 50 + Math.floor(Math.random() * 20) * 10;
      b = [5, 10, 15, 20, 25][Math.floor(Math.random() * 5)];
      answer = a - a * b / 100;
      question = `${a} ${lang === "ar" ? "بعد خصم" : "after"} ${b}%`;
    }

    if (!question) question = `${a} ${symbol} ${b}`;
    return { question, answer };
  }

  function newQuestion() {
    if (!running) return;
    const q = makeQuestion();
    correctAnswer = q.answer;
    questionCount++;
    $("hgQuestion").textContent = q.question;
    $("hgAnswers").replaceChildren();

    const options = new Set([correctAnswer]);
    while (options.size < 4) {
      const spread = Math.max(5, Math.ceil(Math.abs(correctAnswer) * 0.35));
      let candidate = correctAnswer +
        Math.floor(Math.random() * (spread * 2 + 1)) - spread;
      if (candidate !== correctAnswer && candidate >= 0) options.add(candidate);
    }

    [...options].sort(() => Math.random() - 0.5).forEach(value => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hg-answer";
      button.textContent = value;
      button.addEventListener("click", () => answerQuestion(value));
      $("hgAnswers").appendChild(button);
    });
  }

  function answerQuestion(value) {
    if (!running) return;
    if (value === correctAnswer) {
      score++;
      $("hgScore").textContent = score;
      $("hgMessage").textContent = words[lang].right;
    } else {
      $("hgMessage").textContent = words[lang].wrong;
    }
    newQuestion();
  }

  function finishGame() {
    running = false;
    ended = true;
    clearInterval(timer);
    $("hgAnswers").replaceChildren();
    $("hgQuestion").textContent = words[lang].end + score;
    $("hgStart").textContent = words[lang].again;

    if (score > best) {
      best = score;
      try { localStorage.setItem("hasibaGameBest", String(best)); } catch (_) {}
      $("hgMessage").textContent = words[lang].newBest;
    } else {
      $("hgMessage").textContent = words[lang].prompt;
    }
    updateBest();
  }

  function startGame() {
    clearInterval(timer);
    score = 0;
    time = 60;
    questionCount = 0;
    running = true;
    ended = false;
    $("hgScore").textContent = "0";
    $("hgTime").textContent = time;
    $("hgStart").textContent = words[lang].start;
    $("hgMessage").textContent = "";
    newQuestion();

    timer = setInterval(() => {
      time--;
      $("hgTime").textContent = time;
      if (time <= 0) finishGame();
    }, 1000);
  }

  $("hgLang").addEventListener("click", () => {
    setLanguage(lang === "ar" ? "en" : "ar");
  });
  $("hgStart").addEventListener("click", startGame);
  $("hgReset").addEventListener("click", startGame);

  updateBest();
  setLanguage("ar");
})();
</script>
